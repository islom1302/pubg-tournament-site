<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <header class="navbar">
    <h1>PUBG Arena Admin</h1>
    <nav>
      <a href="../index.html">Home</a>
      <a href="tournaments.html">Tournaments</a>
      <a href="profile.html">Profile</a>
    </nav>
  </header>

  <div class="form-page">
    <h2>Create Tournament</h2>
        <form id="createTournamentForm">
          <input type="text" id="name" placeholder="Tournament name" required />
          <input type="text" id="mode" placeholder="Mode (Solo / Duo / Squad)" required />
          <input type="text" id="prize" placeholder="Prize (example: 500 UC)" required />
          <input type="date" id="date" required />
          <input type="number" id="maxPlayers" placeholder="Max players (example: 20)" min="1" />
          <button type="submit">Create Tournament</button>
        </form>
    <p id="createMessage"></p>
  </div>

  <div class="tournament-list">
    <h2>Admin Dashboard</h2>
    <div id="adminContent"></div>
  </div>

  <script>
    if (localStorage.getItem("admin") !== "true") {
      window.location.href = "admin-login.html";
    }

    document.getElementById("createTournamentForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const mode = document.getElementById("mode").value;
      const prize = document.getElementById("prize").value;
      const date = document.getElementById("date").value;
      const maxPlayers = document.getElementById("maxPlayers").value;

      try {
        const response = await fetch("http://localhost:5000/api/tournaments", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ name, mode, prize, date, maxPlayers })
        });

        const data = await response.json();
        document.getElementById("createMessage").innerText = data.message;
        document.getElementById("createTournamentForm").reset();
        loadAdminPanel();
      } catch (error) {
        document.getElementById("createMessage").innerText = "Server error";
      }
    });

    async function loadAdminPanel() {
      const response = await fetch("http://localhost:5000/api/tournaments");
      const tournaments = await response.json();

      const container = document.getElementById("adminContent");
      container.innerHTML = "";

      tournaments.forEach((tournament) => {
        const block = document.createElement("div");
        block.className = "tournament-item";

        let pendingHtml = "";
        if (tournament.pendingApprovals.length === 0) {
          pendingHtml = "<p>No pending requests</p>";
        } else {
          tournament.pendingApprovals.forEach((request) => {
            pendingHtml += `
              <div style="margin-bottom: 14px; padding: 12px; background: rgba(255,255,255,0.04); border-radius: 10px;">
                <p><strong>Player:</strong> ${request.playerName}</p>
                <p><strong>PUBG UID:</strong> ${request.pubgUid || "N/A"}</p>
                <p><strong>Discord:</strong> ${request.discord || "N/A"}</p>

                <div style="display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;">
                  <button onclick="approvePlayer(${tournament.id}, ${request.id})">
                    Approve
                  </button>

                  <button 
                    onclick="declinePlayer(${tournament.id}, ${request.id})"
                    style="background:#dc2626; color:white; border:none; padding:10px 16px; border-radius:8px; cursor:pointer;"
                  >
                    Decline
                  </button>
                </div>
              </div>
            `;
          });
        }

        let approvedHtml = "";
        if (tournament.players.length === 0) {
          approvedHtml = "<p>No approved players yet</p>";
        } else {
          approvedHtml = tournament.players.map((player) => `
            <div style="margin-bottom: 10px; padding: 10px; background: rgba(250,204,21,0.08); border-radius: 10px;">
              <p><strong>${player.playerName}</strong> — Approved</p>
            </div>
          `).join("");
        }

        block.innerHTML = `
          <h3>${tournament.name}</h3>
          <p><strong>Mode:</strong> ${tournament.mode}</p>
          <p><strong>Prize:</strong> ${tournament.prize}</p>
          <p><strong>Date:</strong> ${tournament.date}</p>
          <p><strong>Status:</strong> ${tournament.status || "Waiting"}</p>
          <p><strong>Room ID:</strong> ${tournament.roomId || "Not set"}</p>
          <p><strong>Room Password:</strong> ${tournament.roomPassword || "Not set"}</p>

          <div style="margin: 18px 0; padding: 14px; background: rgba(255,255,255,0.04); border-radius: 12px;">
            <h4>Set Custom Room</h4>
            <input id="roomId-${tournament.id}" type="text" placeholder="Room ID" value="${tournament.roomId || ""}" style="width:100%; padding:12px; margin-bottom:10px; border:none; border-radius:8px;">
            <input id="roomPassword-${tournament.id}" type="text" placeholder="Room Password" value="${tournament.roomPassword || ""}" style="width:100%; padding:12px; margin-bottom:10px; border:none; border-radius:8px;">
            <select id="status-${tournament.id}" style="width:100%; padding:12px; margin-bottom:10px; border:none; border-radius:8px;">
              <option value="Waiting" ${tournament.status === "Waiting" ? "selected" : ""}>Waiting</option>
              <option value="Open" ${tournament.status === "Open" ? "selected" : ""}>Open</option>
              <option value="Live" ${tournament.status === "Live" ? "selected" : ""}>Live</option>
              <option value="Finished" ${tournament.status === "Finished" ? "selected" : ""}>Finished</option>
            </select>
            <button onclick="saveCustomRoom(${tournament.id})">Save Custom Room</button>
          </div>

          <div style="margin: 15px 0;">
            <button onclick="deleteTournament(${tournament.id})" style="background:#dc2626; color:white; border:none; padding:10px 18px; border-radius:8px; cursor:pointer;">
              Delete Tournament
            </button>
          </div>

          <hr style="border-color: rgba(255,255,255,0.08); margin: 20px 0;">

          <h4>Pending Requests</h4>
          ${pendingHtml}

          <hr style="border-color: rgba(255,255,255,0.08); margin: 20px 0;">

          <h4>Approved Players</h4>
          ${approvedHtml}
        `;

        container.appendChild(block);
      });
    }

    async function approvePlayer(tournamentId, requestId) {
      const response = await fetch("http://localhost:5000/api/tournaments/approve", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ tournamentId, requestId })
      });

      const data = await response.json();
      alert(data.message);
      loadAdminPanel();
    }

    async function declinePlayer(tournamentId, requestId) {
      const response = await fetch("http://localhost:5000/api/tournaments/decline", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ tournamentId, requestId })
      });

      const data = await response.json();
      alert(data.message);
      loadAdminPanel();
    }

    async function saveCustomRoom(tournamentId) {
      const roomId = document.getElementById(`roomId-${tournamentId}`).value;
      const roomPassword = document.getElementById(`roomPassword-${tournamentId}`).value;
      const status = document.getElementById(`status-${tournamentId}`).value;

      const response = await fetch(`http://localhost:5000/api/tournaments/${tournamentId}/custom-room`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ roomId, roomPassword, status })
      });

      const data = await response.json();
      alert(data.message);
      loadAdminPanel();
    }

    async function deleteTournament(id) {
      const confirmed = confirm("Are you sure you want to delete this tournament?");
      if (!confirmed) return;

      const response = await fetch(`http://localhost:5000/api/tournaments/${id}`, {
        method: "DELETE"
      });

      const data = await response.json();
      alert(data.message);
      loadAdminPanel();
    }

    loadAdminPanel();
  </script>
</body>
</html>
