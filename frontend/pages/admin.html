<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <header class="navbar">
    <div class="brand-wrap">
      <h1 class="m-0">PUBG Arena Admin</h1>
      <span class="brand-badge">CONTROL</span>
    </div>

    <nav>
      <a href="../index.html">Home</a>
      <a href="tournaments.html">Tournaments</a>
      <a href="profile.html">Profile</a>
    </nav>
  </header>

  <div class="form-page">
    <h2>Create Tournament</h2>
    <form id="createTournamentForm">
      <input type="text" id="name" placeholder="Tournament name" required />
      <input type="text" id="mode" placeholder="Mode (Solo / Duo / Squad)" required />
      <input type="text" id="prize" placeholder="Prize (example: 500 UC)" required />
      <input type="date" id="date" required />
      <input type="number" id="maxPlayers" placeholder="Max players (example: 20)" min="1" />
      <button type="submit">Create Tournament</button>
    </form>
    <p id="createMessage"></p>
  </div>

  <div class="tournament-list">
    <h2>Admin Dashboard</h2>
    <div id="adminContent"></div>
  </div>

  <script>
    if (localStorage.getItem("admin") !== "true") {
      window.location.href = "admin-login.html";
    }

    document.getElementById("createTournamentForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const mode = document.getElementById("mode").value;
      const prize = document.getElementById("prize").value;
      const date = document.getElementById("date").value;
      const maxPlayers = document.getElementById("maxPlayers").value;

      try {
        const response = await fetch("https://pubg-api-d450.onrender.com/api/tournaments", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ name, mode, prize, date, maxPlayers })
        });

        const data = await response.json();
        document.getElementById("createMessage").innerText = data.message;
        document.getElementById("createTournamentForm").reset();
        loadAdminPanel();
      } catch (error) {
        document.getElementById("createMessage").innerText = "Server error";
      }
    });

    function getStatusBadge(status) {
      if (status === "Live") return `<span class="badge bg-danger">Live</span>`;
      if (status === "Open") return `<span class="badge bg-success">Open</span>`;
      if (status === "Finished") return `<span class="badge bg-secondary">Finished</span>`;
      return `<span class="badge bg-warning text-dark">Waiting</span>`;
    }

    function getPlayerCard(player, type, tournamentId, requestId = null) {
      const contact = player.discord || "N/A";

      if (type === "pending") {
        return `
          <div class="pending-box">
            <div style="display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap;">
              <div>
                <p><strong>Player:</strong> ${player.playerName}</p>
                <p><strong>PUBG UID:</strong> ${player.pubgUid || "N/A"}</p>
                <p><strong>Telegram:</strong> ${contact}</p>
              </div>
              <span class="badge bg-warning text-dark">Pending</span>
            </div>

            <div class="inline-actions">
              <button onclick="approvePlayer('${tournamentId}', ${requestId}, this)">
                Approve
              </button>

              <button
                onclick="declinePlayer('${tournamentId}', ${requestId}, this)"
                style="background:#dc2626; color:white; border:none; padding:10px 16px; border-radius:8px; cursor:pointer;"
              >
                Decline
              </button>
            </div>
          </div>
        `;
      }

      return `
        <div class="approved-box">
          <div style="display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap;">
            <div>
              <p><strong>Player:</strong> ${player.playerName}</p>
              <p><strong>PUBG UID:</strong> ${player.pubgUid || "N/A"}</p>
              <p><strong>Telegram:</strong> ${contact}</p>
            </div>
            <div style="text-align:right;">
              <span class="badge bg-success">Approved</span>
              <div style="margin-top:10px;">
                <button
                  onclick="removePlayer('${tournamentId}', '${player.id}', this)"
                  style="background:#dc2626; color:white; border:none; padding:10px 16px; border-radius:8px; cursor:pointer;"
                >
                  Remove
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    async function loadAdminPanel() {
      const response = await fetch("https://pubg-api-d450.onrender.com/api/tournaments");
      const tournaments = await response.json();

      const container = document.getElementById("adminContent");
      container.innerHTML = "";

      if (!tournaments.length) {
        container.innerHTML = `<div class="empty-box">No tournaments created yet.</div>`;
        return;
      }

      tournaments.forEach((tournament) => {
        const block = document.createElement("div");
        block.className = "tournament-item";

        let pendingHtml = "";
        if (!tournament.pendingApprovals || tournament.pendingApprovals.length === 0) {
          pendingHtml = `<div class="empty-box">No pending requests</div>`;
        } else {
          pendingHtml = tournament.pendingApprovals.map((request) =>
            getPlayerCard(request, "pending", tournament._id, request.id)
          ).join("");
        }

        let approvedHtml = "";
        if (!tournament.players || tournament.players.length === 0) {
          approvedHtml = `<div class="empty-box">No approved players yet</div>`;
        } else {
          approvedHtml = tournament.players.map((player) =>
            getPlayerCard(player, "approved", tournament._id)
          ).join("");
        }

        block.innerHTML = `
          <div style="display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap;">
            <div>
              <h3 style="margin-bottom:10px;">${tournament.name}</h3>
              <p><strong>Mode:</strong> ${tournament.mode}</p>
              <p><strong>Prize:</strong> ${tournament.prize}</p>
              <p><strong>Date:</strong> ${tournament.date}</p>
            </div>
            <div style="text-align:right;">
              ${getStatusBadge(tournament.status || "Waiting")}
              <p style="margin-top:10px;"><strong>Players:</strong> ${(tournament.players || []).length} / ${tournament.maxPlayers}</p>
            </div>
          </div>

          <div class="room-box">
            <h4>Custom Room & Status</h4>

            <p><strong>Room ID:</strong> ${tournament.roomId || "Not set"}</p>
            <p><strong>Room Password:</strong> ${tournament.roomPassword || "Not set"}</p>

            <input id="roomId-${tournament._id}" type="text" placeholder="Room ID" value="${tournament.roomId || ""}">
            <input id="roomPassword-${tournament._id}" type="text" placeholder="Room Password" value="${tournament.roomPassword || ""}">

            <select id="status-${tournament._id}">
              <option value="Waiting" ${tournament.status === "Waiting" ? "selected" : ""}>Waiting</option>
              <option value="Open" ${tournament.status === "Open" ? "selected" : ""}>Open</option>
              <option value="Live" ${tournament.status === "Live" ? "selected" : ""}>Live</option>
              <option value="Finished" ${tournament.status === "Finished" ? "selected" : ""}>Finished</option>
            </select>

            <div class="inline-actions">
              <button onclick="saveCustomRoom('${tournament._id}', this)">Save Room & Status</button>
              <button
                onclick="deleteTournament('${tournament._id}', this)"
                style="background:#dc2626; color:white; border:none; padding:10px 18px; border-radius:8px; cursor:pointer;"
              >
                Delete Tournament
              </button>
            </div>
          </div>

          <hr>

          <h4>Pending Requests (${(tournament.pendingApprovals || []).length})</h4>
          ${pendingHtml}

          <hr>

          <h4>Approved Players (${(tournament.players || []).length})</h4>
          ${approvedHtml}
        `;

        container.appendChild(block);
      });
    }

    async function approvePlayer(tournamentId, requestId, button) {
      const originalText = button.innerText;
      button.innerText = "Approving...";
      button.disabled = true;

      try {
        const response = await fetch("https://pubg-api-d450.onrender.com/api/tournaments/approve", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ tournamentId, requestId })
        });

        const data = await response.json();
        alert(data.message);
        loadAdminPanel();
      } catch (error) {
        alert("Server error");
        button.innerText = originalText;
        button.disabled = false;
      }
    }

    async function declinePlayer(tournamentId, requestId, button) {
      const originalText = button.innerText;
      button.innerText = "Declining...";
      button.disabled = true;

      try {
        const response = await fetch("https://pubg-api-d450.onrender.com/api/tournaments/decline", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ tournamentId, requestId })
        });

        const data = await response.json();
        alert(data.message);
        loadAdminPanel();
      } catch (error) {
        alert("Server error");
        button.innerText = originalText;
        button.disabled = false;
      }
    }

    async function removePlayer(tournamentId, playerId, button) {
      const originalText = button.innerText;
      button.innerText = "Removing...";
      button.disabled = true;

      try {
        const response = await fetch("https://pubg-api-d450.onrender.com/api/tournaments/remove-player", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ tournamentId, playerId })
        });

        const data = await response.json();
        alert(data.message);
        loadAdminPanel();
      } catch (error) {
        alert("Server error");
        button.innerText = originalText;
        button.disabled = false;
      }
    }

    async function saveCustomRoom(tournamentId, button) {
      const roomId = document.getElementById(`roomId-${tournamentId}`).value;
      const roomPassword = document.getElementById(`roomPassword-${tournamentId}`).value;
      const status = document.getElementById(`status-${tournamentId}`).value;

      const originalText = button.innerText;
      button.innerText = "Saving...";
      button.disabled = true;

      try {
        const response = await fetch(`https://pubg-api-d450.onrender.com/api/tournaments/${tournamentId}/custom-room`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ roomId, roomPassword, status })
        });

        const data = await response.json();
        alert(data.message);
        loadAdminPanel();
      } catch (error) {
        alert("Server error");
        button.innerText = originalText;
        button.disabled = false;
      }
    }

    async function deleteTournament(id, button) {
      const confirmed = confirm("Are you sure you want to delete this tournament?");
      if (!confirmed) return;

      const originalText = button.innerText;
      button.innerText = "Deleting...";
      button.disabled = true;

      try {
        const response = await fetch(`https://pubg-api-d450.onrender.com/api/tournaments/${id}`, {
          method: "DELETE"
        });

        const data = await response.json();
        alert(data.message);
        loadAdminPanel();
      } catch (error) {
        alert("Server error");
        button.innerText = originalText;
        button.disabled = false;
      }
    }

    loadAdminPanel();
  </script>
</body>
</html>
