<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta charset="UTF-8" />
  <title>Login</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

  <div class="form-page">
    <h2 data-i18n="login">Login</h2>

    <form id="loginForm">
      <input
        type="email"
        id="email"
        placeholder="Email"
        required
        data-i18n-placeholder="email_placeholder"
      />

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
        data-i18n-placeholder="password_placeholder"
      />

      <button type="submit" data-i18n="login">Login</button>
    </form>

    <p id="message"></p>
  </div>

  <script src="../lang.js"></script>
  <script src="../script.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("https://pubg-api-d450.onrender.com/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (data.message === "Login successful") {
          localStorage.setItem("user", JSON.stringify(data.user));
          window.location.href = "profile.html";
        } else {
          document.getElementById("message").innerText = data.message;
        }
      } catch (error) {
        document.getElementById("message").innerText = "Server error";
      }
    });

    applyTranslations();
    updateLanguageButton();
  </script>
</body>
</html>
