<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <title>Sign Up</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <div class="form-page">
    <h2 data-i18n="signup">Sign Up</h2>

    <form id="signupForm">
      <input
        type="text"
        id="username"
        placeholder="Username"
        required
        data-i18n-placeholder="username_placeholder"
      >

      <input
        type="email"
        id="email"
        placeholder="Email"
        required
        data-i18n-placeholder="email_placeholder"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
        data-i18n-placeholder="password_placeholder"
      >

      <input
        type="text"
        id="pubgUid"
        placeholder="PUBG UID"
        data-i18n-placeholder="pubg_uid_placeholder"
      >

      <input
        type="text"
        id="discord"
        placeholder="Telegram username"
        data-i18n-placeholder="telegram_placeholder"
      >

      <button type="submit" data-i18n="signup">Sign Up</button>
    </form>

    <p id="message"></p>
  </div>

  <script src="../lang.js"></script>
<script src="../script.js"></script>
<script>
document.getElementById("signupForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const pubgUid = document.getElementById("pubgUid").value.trim();
  const discord = document.getElementById("discord").value.trim();

  const messageBox = document.getElementById("message");
  messageBox.innerText = "";

  try {
    const response = await fetch("https://pubg-api-d450.onrender.com/api/auth/signup", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        username,
        email,
        password,
        pubgUid,
        discord
      })
    });

    const data = await response.json();

    if (response.ok) {
      if (data.user) {
        localStorage.setItem("user", JSON.stringify(data.user));
        window.location.href = "profile.html";
        return;
      }

      localStorage.setItem("user", JSON.stringify({
        username,
        email,
        pubgUid,
        discord
      }));
      window.location.href = "profile.html";
      return;
    }

    messageBox.innerText = data.message || "Signup failed";
  } catch (error) {
    messageBox.innerText = "Server error";
  }
});
</script>
<script>
  redirectIfLoggedIn();
</script>
</body>
</html>
