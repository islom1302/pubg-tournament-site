<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tournaments</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <header class="navbar">
    <div class="brand-wrap">
      <h1 class="m-0" data-i18n="site_title">PUBG Arena</h1>
      <span class="brand-badge">ESPORTS</span>
    </div>

    <div class="dropdown lang-float">
      <button
        id="langButton"
        class="lang-circle-btn"
        type="button"
        data-bs-toggle="dropdown"
        aria-expanded="false"
      >
        🌐
      </button>

      <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end lang-menu">
        <li><button class="dropdown-item" type="button" data-lang-switch="en">🇬🇧 English</button></li>
        <li><button class="dropdown-item" type="button" data-lang-switch="ru">🇷🇺 Русский</button></li>
        <li><button class="dropdown-item" type="button" data-lang-switch="uz">🇺🇿 O'zbek</button></li>
      </ul>
    </div>

    <nav>
      <a href="../index.html" data-i18n="home">Home</a>
      <a href="profile.html" data-i18n="profile">Profile</a>
      <a href="login.html" data-i18n="login">Login</a>
    </nav>
  </header>

  <div class="tournament-list">
    <h2 data-i18n="available_tournaments">Available Tournaments</h2>
    <div id="tournaments"></div>
  </div>

  <script src="../lang.js"></script>
  <script src="../script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

      <script>

          function getCurrentUser(){
          const saved=localStorage.getItem("user");
          return saved?JSON.parse(saved):null;
          }

          function isSamePlayer(item,user){
          if(!user||!item)return false;

          if(user.pubgUid&&item.pubgUid){
          return user.pubgUid===item.pubgUid;
          }

          return user.username===item.playerName;
          }

          function getJoinState(tournament,user){

          if(!user)return"login-required";

          const pending=(tournament.pendingApprovals||[]).some(p=>isSamePlayer(p,user));
          if(pending)return"pending";

          const approved=(tournament.players||[]).some(p=>isSamePlayer(p,user));
          if(approved)return"approved";

          if((tournament.players||[]).length>=tournament.maxPlayers)return"full";

          return"can-join";

          }

          function getButtonInfo(state){

          if(state==="pending")return{text:t("request_sent"),disabled:true};
          if(state==="approved")return{text:t("joined"),disabled:true};
          if(state==="full")return{text:t("full"),disabled:true};
          if(state==="login-required")return{text:t("login_required"),disabled:true};

          return{text:t("join_tournament"),disabled:false};

          }

          function statusBadge(status){

          if(status==="Live")return`<span class="badge bg-danger">${t("live")}</span>`;

          if(status==="Open")return`<span class="badge bg-success">${t("open")}</span>`;

          if(status==="Waiting")return`<span class="badge bg-warning text-dark">${t("waiting")}</span>`;

          if(status==="Finished")return`<span class="badge bg-secondary">${t("finished")}</span>`;

          return status;

          }

          async function loadTournaments(){

          const container=document.getElementById("tournaments");

          container.innerHTML=`<div class="empty-box">${t("loading")}</div>`;

          const response=await fetch("https://pubg-api-d450.onrender.com/api/tournaments");

          const tournaments=await response.json();

          const user=getCurrentUser();

          container.innerHTML="";

          if(tournaments.length===0){

          container.innerHTML=`<div class="empty-box">${t("no_tournaments_available")}</div>`;

          return;

          }

          tournaments.forEach(tournament=>{

          const state=getJoinState(tournament,user);

          const buttonInfo=getButtonInfo(state);

          const approvedForTournament=state==="approved";

          const block=document.createElement("div");

          block.className="tournament-item";

          let roomInfoHtml=`
          <p><strong>${t("room_access")}:</strong> ${t("room_access_live")}</p>
          `;

          if(approvedForTournament&&tournament.status==="Live"){

          roomInfoHtml=`

          <div class="room-live-box">

          <p><strong>${t("room_id")}:</strong> ${tournament.roomId||t("not_set_yet")}</p>

          <p><strong>${t("room_password")}:</strong> ${tournament.roomPassword||t("not_set_yet")}</p>

          </div>

          `;

          }

          block.innerHTML=`

          <h3>${tournament.name}</h3>

          <p><strong>${t("status")}:</strong> ${statusBadge(tournament.status||"Waiting")}</p>

          <p><strong>${t("mode")}:</strong> ${tournament.mode}</p>

          <p><strong>${t("prize")}:</strong> ${tournament.prize}</p>

          <p><strong>${t("date")}:</strong> ${tournament.date}</p>

          <p><strong>${t("players")}:</strong> ${(tournament.players||[]).length}/${tournament.maxPlayers}</p>

          <button
          onclick="joinTournament('${tournament._id}',this)"
          ${buttonInfo.disabled?"disabled":""}
          >

          ${buttonInfo.text}

          </button>

          ${roomInfoHtml}

          `;

          container.appendChild(block);

          });

          }

          async function joinTournament(tournamentId,button){

          const user=getCurrentUser();

          if(!user){

          alert(t("must_login_first"));

          return;

          }

          button.innerText=t("joining");

          button.disabled=true;

          const response=await fetch("https://pubg-api-d450.onrender.com/api/tournaments/join",{

          method:"POST",

          headers:{
          "Content-Type":"application/json"
          },

          body:JSON.stringify({

          tournamentId,

          playerName:user.username,

          pubgUid:user.pubgUid,

          discord:user.discord

          })

          });

          const data=await response.json();

          alert(data.message);

          loadTournaments();

          }

          document.addEventListener("DOMContentLoaded",()=>{

          loadTournaments();

          });

    </script>
</body>
</html>
